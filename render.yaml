services:
  - type: web
    name: ai-resume-analyzer-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_NAME
        value: AI Resume Analyzer
      - key: API_PREFIX
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: ai-resume-analyzer-db
          property: connectionString
      - key: UPLOAD_DIR
        value: uploads
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: MAX_UPLOAD_SIZE_MB
        value: 5
      - key: DEBUG_PASSWORD_RESET_TOKENS
        value: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: ^https://.*\.vercel\.app$
      - key: JWT_SECRET_KEY
        sync: false

databases:
  - name: ai-resume-analyzer-db
    plan: free
